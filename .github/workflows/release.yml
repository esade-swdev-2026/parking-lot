
name: release

on:
  push:
    tags:
      - "v1.0"
      - "v1.0.*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest

      - name: Build the image
        run: docker build -t parking-lot .

      - name: Run the image
        run: docker run --rm parking-lot --help
      
      - name: Test persistence between containers
        env:
          VOLUME: parking-lot-ci-${{ github.run_id }}
        run: |
          trap 'docker volume rm --force "$VOLUME"' EXIT
          docker run --rm -v "$VOLUME":/app/data parking-lot enter 1234ABC
          docker run --rm -v "$VOLUME":/app/data --entrypoint cat parking-lot /app/data/lot.json | grep 1234ABC
          docker run --rm -v "$VOLUME":/app/data parking-lot check-if-car-inside 1234ABC | grep "is inside"
          docker run --rm -v "$VOLUME":/app/data parking-lot leave 1234ABC
          test "$(docker run --rm -v "$VOLUME":/app/data --entrypoint cat parking-lot /app/data/lot.json)" = "{}"

  publish:
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/esade-swdev-2026/parking-lot:${{ github.ref_name }}
